name: StudyLab
options:
  bundleIdPrefix: pt.studylab
  developmentLanguage: pt-PT
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StudyLab:
    type: application
    platform: iOS
    sources:
      - StudyLab
      - Shared
    dependencies:
      - target: StudyLabWidgets
      - target: StudyLabWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.studylab.StudyLab
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: StudyLab
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
  StudyLabWidgets:
    type: app-extension
    platform: iOS
    sources:
      - StudyLabWidgets
      - Shared
      - path: StudyLab/Extensions/Color+Hex.swift
    info:
      path: StudyLabWidgets/Info.plist
      properties:
        CFBundleDisplayName: StudyLab Timer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.studylab.StudyLab.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: StudyLab Timer
  StudyLabMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: StudyLab
      - path: Shared
    entitlements:
      path: StudyLabMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_NAME: StudyLab
        PRODUCT_BUNDLE_IDENTIFIER: pt.studylab.StudyLab
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: StudyLab
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: YES
  StudyLabWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - StudyLabWatch
      - path: Shared/WatchSync.swift
      - path: StudyLab/Extensions/Color+Hex.swift
      - path: StudyLab/Extensions/DurationFormat.swift
      - path: StudyLab/Extensions/Locale+PT.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.studylab.StudyLab.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StudyLab
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: pt.studylab.StudyLab
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
