<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyLab Buddy</title>
    <script>
      try {
        var st = (JSON.parse(localStorage.getItem('studylab.db.v1') || '{}').settings || {}).theme || 'system'
        var dark = st === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : st === 'dark'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
